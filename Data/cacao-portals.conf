# xdg-desktop-portal's choice of backends when XDG_CURRENT_DESKTOP=Cacao.
#
# The settings service is the only Settings provider, so apps never see two
# that disagree. The file manager, Files from swift-linux-core-apps, shows
# every app's Open and Save dialogs. Interfaces neither implements yet
# (screenshots, screencasts) fall back to the wlroots portal while sway
# stands in.
[preferred]
default=wlr;
org.freedesktop.impl.portal.Settings=cacao;
org.freedesktop.impl.portal.FileChooser=cacao-files;
